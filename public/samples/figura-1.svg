<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-label="Gráfico de barras del índice de adopción por dimensión">
  <rect width="800" height="420" fill="#ffffff" />
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">
    <text x="40" y="34" font-size="16" font-weight="700">Índice de adopción por dimensión</text>
    <text x="40" y="56" font-size="12" fill="#666666">Escala de 0 a 100</text>
  </g>

  <g stroke="#d9dde3" stroke-width="1">
    <line x1="90" y1="100" x2="740" y2="100" />
    <line x1="90" y1="160" x2="740" y2="160" />
    <line x1="90" y1="220" x2="740" y2="220" />
    <line x1="90" y1="280" x2="740" y2="280" />
    <line x1="90" y1="340" x2="740" y2="340" />
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="end">
    <text x="78" y="104">100</text>
    <text x="78" y="164">75</text>
    <text x="78" y="224">50</text>
    <text x="78" y="284">25</text>
    <text x="78" y="344">0</text>
  </g>

  <g fill="#1f3a5f">
    <rect x="130" y="128" width="110" height="212" />
    <rect x="290" y="117" width="110" height="223" />
    <rect x="450" y="170" width="110" height="170" />
    <rect x="610" y="240" width="110" height="100" />
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f3a5f" text-anchor="middle">
    <text x="185" y="118">78</text>
    <text x="345" y="107">92</text>
    <text x="505" y="160">64</text>
    <text x="665" y="230">41</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333333" text-anchor="middle">
    <text x="185" y="364">Planificación</text>
    <text x="345" y="364">Codificación</text>
    <text x="505" y="364">Pruebas</text>
    <text x="665" y="364">Documentación</text>
  </g>

  <line x1="90" y1="340" x2="740" y2="340" stroke="#333333" stroke-width="1.5" />
  <line x1="90" y1="100" x2="90" y2="340" stroke="#333333" stroke-width="1.5" />
</svg>
